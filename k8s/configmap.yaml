apiVersion: v1
kind: ConfigMap
metadata:
  name: startupintel-config
  namespace: startupintel
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DOCS_URL: "/docs"
  REDOC_URL: "/redoc"
  LOG_LEVEL: "INFO"
  CACHE_TTL_SECONDS: "300"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  CORS_ALLOWED_ORIGINS: "https://startupintel.io,https://app.startupintel.io"
  USE_REDIS_CONVERSATIONS: "true"
