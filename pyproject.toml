[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "startupintel"
version = "0.1.0"
description = "Open-source startup intelligence platform powered by specialized ML bots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhinaysai Kamineni" }]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "redis>=5.0.4",
  "neo4j>=5.20.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "tenacity>=8.2.3",
  "structlog>=24.1.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
ml = [
  "faiss-cpu>=1.8.0",
  "networkx>=3.3",
  "numpy>=1.26.4",
  "ruptures>=1.1.9",
  "sentence-transformers>=2.7.0",
  "xgboost>=2.0.3",
]
storage = [
  "boto3>=1.34.0",
  "Pillow>=10.3.0",
]
notifications = [
  "sendgrid>=6.11.0",
  "boto3>=1.34.0",
]
search = [
  "elasticsearch>=8.13.0",
]
slack = [
  "slack-bolt>=1.18.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.4",
  "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["startupintel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
